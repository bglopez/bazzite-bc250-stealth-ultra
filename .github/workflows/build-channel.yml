name: Build Bazzite channel
on:
  workflow_call:
    inputs:
      channel:
        description: Upstream Bazzite channel (stable or testing)
        required: true
        type: string
    secrets:
      SIGNING_SECRET:
        required: true
      COSIGN_PASSWORD:
        required: true
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  upstream:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.base.outputs.digest }}
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - name: Resolve upstream Bazzite Deck base digest
        id: base
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          digest=$(docker buildx imagetools inspect \
            "ghcr.io/ublue-os/bazzite-deck:$CHANNEL" \
            --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Resolve upstream base image kernel
        id: kernel
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          release=$(docker buildx imagetools inspect \
            "ghcr.io/ublue-os/bazzite-deck:$CHANNEL" \
            --format '{{json .Image}}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["config"]["Labels"]["ostree.linux"])')
          [[ "$release" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?-ogc[0-9]+\.[0-9]+\.fc[0-9]+\.x86_64$ ]]
          echo "release=$release" >> "$GITHUB_OUTPUT"
          major=$(sed -E 's/.*\.fc([0-9]+)\..*/\1/' <<<"$release")
          # The amdgpu module is built against the base image's exact kernel,
          # so the matching akmods image has to exist before the build runs.
          akmods="ghcr.io/ublue-os/akmods:ogc-${major}-${release}"
          echo "akmods image: $akmods"
          docker buildx imagetools inspect "$akmods" >/dev/null
      - name: Restore last successfully published base
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/bc250-base-digest
          key: bc250-published-base-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bc250-published-base-${{ inputs.channel }}-
      - name: Compare upstream with last publication
        id: compare
        env:
          BASE_DIGEST: ${{ steps.base.outputs.digest }}
        run: |
          previous=$(cat "$RUNNER_TEMP/bc250-base-digest" 2>/dev/null || true)
          if [[ "$previous" == "$BASE_DIGEST" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
  bluebuild:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check signing key before building
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          test -n "$COSIGN_PRIVATE_KEY" || { echo 'Missing SIGNING_SECRET'; exit 1; }
          test -n "$COSIGN_PASSWORD" || { echo 'Missing COSIGN_PASSWORD'; exit 1; }
      - name: Maximize build space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5
        with:
          skip-if-available: "80G"
      - name: Set up Docker Buildx
        run: |
          docker buildx create --name bluebuild-builder --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Install BlueBuild
        run: |
          sudo docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
          sudo docker cp blue-build-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm blue-build-installer
          bluebuild --version
      - name: Install cosign
        env:
          COSIGN_VERSION: v3.0.6
        run: |
          curl -fsSL -o cosign "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          sudo install -m 0755 cosign /usr/local/bin/cosign
          rm cosign
          cosign version
      - name: Validate signing key
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          cosign public-key --key env://COSIGN_PRIVATE_KEY > "$RUNNER_TEMP/cosign.pub"
          cmp cosign.pub "$RUNNER_TEMP/cosign.pub"
      - name: Build and push staging image
        id: build
        env:
          BB_BUILD_PUSH: "true"
          BB_PASSWORD: ${{ github.token }}
          BB_USERNAME: ${{ github.repository_owner }}
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          RUST_LOG_STYLE: always
          CHANNEL: ${{ inputs.channel }}
        run: |
          staging_tag="staging-${CHANNEL}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python3 .github/render-recipe.py \
            --channel "$CHANNEL" \
            --kernel-release "${{ steps.kernel.outputs.release }}" \
            --staging-tag "$staging_tag" \
            --output recipes/recipe-ci.yml
          bluebuild build --no-sign -v recipes/recipe-ci.yml
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bazzite-bc250-stealth-ultra"
          digest=$(docker buildx imagetools inspect "$image:$staging_tag" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Sign and verify image digest
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --new-bundle-format=false --use-signing-config=false --recursive "$IMAGE@$DIGEST"
          cosign verify --key cosign.pub "$IMAGE@$DIGEST"
      - name: Publish verified deployment tag
        env:
          CHANNEL: ${{ inputs.channel }}
          IMAGE: ${{ steps.build.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          case "$CHANNEL" in
            stable) tag=latest ;;
            testing) tag=testing ;;
            *) echo "Unsupported channel: $CHANNEL"; exit 1 ;;
          esac
          docker buildx imagetools create --prefer-index=false \
            --tag "$IMAGE:$tag" "$IMAGE@$DIGEST"
          published=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{.Manifest.Digest}}')
          test "$published" = "$DIGEST"
          cosign verify --key cosign.pub "$IMAGE@$published"
      - name: Record successfully published base
        env:
          BASE_DIGEST: ${{ needs.upstream.outputs.digest }}
        run: printf '%s\n' "$BASE_DIGEST" > "$RUNNER_TEMP/bc250-base-digest"
      - name: Cache successfully published base digest
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/bc250-base-digest
          key: bc250-published-base-${{ inputs.channel }}-${{ github.run_id }}-${{ github.run_attempt }}

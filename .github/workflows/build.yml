name: Build BC250 Stealth Ultra
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Buildah and Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y buildah podman
          buildah version
          podman --version
      - name: Resolve upstream driver commit
        id: driver
        run: |
          XONE_COMMIT="$(git ls-remote https://github.com/honjow/xonedo.git HEAD | cut -f1)"
          test -n "$XONE_COMMIT"
          echo "commit=$XONE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "Using xonedo commit: $XONE_COMMIT"
      - name: Build image with Buildah (VFS)
        env:
          STORAGE_DRIVER: vfs
          BUILDAH_ISOLATION: chroot
          XONE_COMMIT: ${{ steps.driver.outputs.commit }}
        run: |
          sudo --preserve-env=STORAGE_DRIVER,BUILDAH_ISOLATION,XONE_COMMIT \
            buildah --storage-driver vfs bud --isolation chroot \
            --format oci --build-arg "XONE_COMMIT=$XONE_COMMIT" \
            -f Containerfile \
            -t ghcr.io/bglopez/bazzite-bc250-stealth-ultra:test .
      - name: Push image to GHCR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GH_TOKEN" | sudo buildah --storage-driver vfs login \
            -u "$GITHUB_ACTOR" --password-stdin ghcr.io
          sudo buildah --storage-driver vfs push \
            ghcr.io/bglopez/bazzite-bc250-stealth-ultra:test \
            docker://ghcr.io/bglopez/bazzite-bc250-stealth-ultra:test

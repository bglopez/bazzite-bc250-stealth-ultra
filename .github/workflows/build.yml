name: Build BC250 Stealth Ultra
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        env:
          XONE_REPO: honjow/xonedo
        run: |
          XONE_COMMIT="$(git ls-remote "https://github.com/${XONE_REPO}.git" HEAD | cut -f1)"
          test "$XONE_COMMIT" != "" || { echo "Unable to resolve upstream HEAD"; exit 1; }
          echo "Building xonedo upstream commit: $XONE_COMMIT"
          docker build --build-arg XONE_COMMIT="$XONE_COMMIT" -t "ghcr.io/${GITHUB_REPOSITORY,,}:test" .
      - name: Push image
        run: docker push "ghcr.io/${GITHUB_REPOSITORY,,}:test"

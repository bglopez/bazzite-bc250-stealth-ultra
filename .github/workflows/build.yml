name: Build BC250 Stealth Ultra
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
concurrency:
  group: bc250-stealth-ultra-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, testing]
    uses: ./.github/workflows/build-channel.yml
    with:
      channel: ${{ matrix.channel }}
    secrets: inherit

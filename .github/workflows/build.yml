name: Build BC250 Stealth Ultra
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
concurrency:
  group: bc250-stealth-ultra-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  bluebuild:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Maximize build space
        uses: hastd/free-disk-space@68572aeaadb7f76bd408246328e95926323402b5
        with:
          skip-if-available: "80G"
      - name: Set up Docker Buildx
        run: |
          docker buildx create --name bluebuild-builder --driver docker-container --use
          docker buildx inspect --bootstrap
      - name: Install BlueBuild
        run: |
          sudo docker create --name blue-build-installer ghcr.io/blue-build/cli:v0.9-installer
          sudo docker cp blue-build-installer:/out/bluebuild /usr/bin/bluebuild
          sudo docker rm blue-build-installer
          bluebuild --version
      - name: Build and push experimental image
        env:
          BB_BUILD_PUSH: "true"
          BB_PASSWORD: ${{ github.token }}
          BB_USERNAME: ${{ github.repository_owner }}
          BB_REGISTRY: ghcr.io
          BB_REGISTRY_NAMESPACE: ${{ github.repository_owner }}
          RUST_LOG_STYLE: always
        run: bluebuild build -v recipes/recipe.yml

name: bazzite-bc250-stealth-ultra
description: BC-250 40CU Bazzite Deck image based on upstream Bazzite with diagnostics and recovery helpers
base-image: ghcr.io/ublue-os/bazzite-deck
image-version: stable
alt-tags: [staging]
stages:
  - name: async-radv
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: files
        files:
          - source: async-compute
            destination: /tmp/bc250-async
      - type: script
        scripts:
          - build-async-radv.sh
modules:
  - type: dnf
    repos:
      copr:
        - filippor/bazzite
    install:
      install-weak-deps: false
      packages:
        - cyan-skillfish-governor-smu
        - pciutils
        - umr
  - type: copy
    from: async-radv
    src: /out/usr/
    dest: /usr/
  - type: files
    files:
      - source: system
        destination: /
  - type: script
    scripts:
      - install-40cu.sh
  # 40CU is enabled at every boot; cap the governor at the community
  # 40CU sweet spot (1500 MHz / 900 mV) so stock 24CU defaults cannot
  # over-drive the unlocked board. Helper backs up the package config.
  - type: script
    snippets:
      - 'bc250-governor-profile sweet-spot || true'
  - type: systemd
    system:
      enabled:
        - cyan-skillfish-governor-smu.service
        - fstrim.timer
        - bc250-force-40cu.service
      disabled:
        - hhd.service
      masked:
        - hhd.service
  - type: script
    snippets:
      - 'mkdir -p /usr/lib/systemd/journald.conf.d'
      - 'printf "[Journal]\\nSystemMaxUse=512M\\nSystemKeepFree=1G\\n" > /usr/lib/systemd/journald.conf.d/60-bc250-storage.conf'
  - type: kargs
    kargs:
      - mitigations=off
      - zswap.enabled=1
      - zswap.max_pool_percent=25
      - zswap.compressor=lz4
  - type: signing
  - type: justfiles
    include:
      - bc250-40cu.just
      - bc250-custom.just
  - type: script
    scripts:
      - configure-radv.sh
  - type: initramfs
  - type: script
    scripts:
      - check-acpi.sh
      - check-image.sh

name: bazzite-bc250-stealth-ultra
description: BC-250 40CU Bazzite Deck image based on upstream Bazzite with diagnostics and recovery helpers
base-image: ghcr.io/ublue-os/bazzite-deck
image-version: stable
alt-tags: [staging]
stages:
  # The private RADV is built at the base image's own Mesa version and with
  # the base image's OpenGamingCollective patches, so it stays in step with
  # the Mesa Bazzite ships. That requires this stage to start FROM the base
  # image: the version comes from the base image's own RPM.
  - name: async-radv
    from: ghcr.io/ublue-os/bazzite-deck:stable
    modules:
      - type: files
        files:
          - source: async-compute
            destination: /tmp/bc250-async
      - type: script
        scripts:
          - build-async-radv.sh
  # Patched amdgpu for the base image's exact kernel. The kernel-devel RPM
  # comes from the matching Universal Blue akmods image, and the amdgpu
  # sources from kernel.org plus the OpenGamingCollective changes that the
  # base image's kernel carries.
  - name: gfx1013-kmod
    from: ghcr.io/ublue-os/bazzite-deck:stable
    modules:
      - type: copy
        from: ghcr.io/ublue-os/akmods:ogc-44-7.2.9-ogc3.1.fc44.x86_64
        src: kernel-rpms
        dest: /tmp/kernel-rpms
      - type: files
        files:
          - source: gfx1013-kmod
            destination: /tmp/bc250-gfx1013
      - type: script
        scripts:
          - build-gfx1013-kmod.sh
modules:
  - type: dnf
    repos:
      copr:
        - filippor/bazzite
    install:
      install-weak-deps: false
      packages:
        - cyan-skillfish-governor-smu
        - pciutils
        - umr
  - type: copy
    from: async-radv
    src: /out/usr/
    dest: /usr/
  - type: copy
    from: gfx1013-kmod
    src: /out/usr/
    dest: /usr/
  - type: files
    files:
      - source: system
        destination: /
  - type: script
    scripts:
      - install-40cu.sh
  # 40CU is enabled at every boot; cap the governor at the community
  # 40CU sweet spot (1500 MHz / 900 mV) so stock 24CU defaults cannot
  # over-drive the unlocked board. Helper backs up the package config.
  - type: script
    snippets:
      - 'bc250-governor-profile sweet-spot || true'
  - type: systemd
    system:
      enabled:
        - cyan-skillfish-governor-smu.service
        - fstrim.timer
        - bc250-force-40cu.service
  - type: script
    snippets:
      - 'mkdir -p /usr/lib/systemd/journald.conf.d'
      - 'printf "[Journal]\\nSystemMaxUse=512M\\nSystemKeepFree=1G\\n" > /usr/lib/systemd/journald.conf.d/60-bc250-storage.conf'
  - type: kargs
    kargs:
      - mitigations=off
      - zswap.enabled=1
      - zswap.max_pool_percent=25
      - zswap.compressor=lz4
  - type: signing
  - type: justfiles
    include:
      - bc250-40cu.just
      - bc250-custom.just
  - type: script
    scripts:
      - configure-radv.sh
  # The patched amdgpu replaces the stock module before the initramfs is
  # regenerated, so the initramfs carries the patched driver and not the
  # stock one.
  - type: script
    scripts:
      - install-gfx1013-kmod.sh
  - type: initramfs
  - type: script
    scripts:
      - check-acpi.sh
      - check-image.sh

name: bazzite-bc250-stealth-ultra
description: BC-250 40CU Bazzite Deck image based on 62fixolab with diagnostics and recovery helpers
base-image: ghcr.io/62fixolab/bazzite-bc250-patched-deck-40cu
image-version: latest
alt-tags: [staging]
stages:
  - name: async-radv
    from: registry.fedoraproject.org/fedora:44
    modules:
      - type: files
        files:
          - source: async-compute
            destination: /tmp/bc250-async
      - type: script
        scripts:
          - build-async-radv.sh
modules:
  - type: copy
    from: async-radv
    src: /out/usr/
    dest: /usr/
  - type: files
    files:
      - source: system
        destination: /
  - type: systemd
    system:
      enabled:
        - fstrim.timer
        - bc250-force-40cu.service
  - type: script
    snippets:
      - 'mkdir -p /usr/lib/systemd/journald.conf.d'
      - 'printf "[Journal]\\nSystemMaxUse=512M\\nSystemKeepFree=1G\\n" > /usr/lib/systemd/journald.conf.d/60-bc250-storage.conf'
  - type: kargs
    kargs:
      - mitigations=off
  - type: signing
  - type: justfiles
    include:
      - bc250-custom.just
  - type: script
    scripts:
      - configure-radv.sh
      - check-image.sh
